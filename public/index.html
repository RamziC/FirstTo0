<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>First to 0</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #fafafa;
            color: #18181b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background-color 0.15s ease;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 40px 0;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .hb-container {
            width: 100%;
            max-width: 600px;
            background-color: #e4e4e7;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 40px;
            position: relative;
            box-sizing: border-box;
        }

        .hb-fill {
            height: 50px;
            width: 100%;
            background: #18181b;
            border-radius: 8px;
            transition: width 0.05s linear;
        }

        .hb-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 700;
            color: #ffffff;
            mix-blend-mode: difference;
            pointer-events: none;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 650px;
        }

        button {
            flex: 1;
            height: 140px;
            font-size: 1.75rem;
            font-weight: 700;
            border: 2px solid #18181b;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.05s, background-color 0.1s;
            touch-action: manipulation;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn-light {
            background-color: #ffffff;
            color: #18181b;
        }

        .btn-medium {
            background-color: #71717a;
            color: #ffffff;
            border-color: #71717a;
        }

        .btn-heavy {
            background-color: #18181b;
            color: #ffffff;
        }

        button:disabled {
            background-color: #f4f4f5;
            color: #a1a1aa;
            border-color: #e4e4e7;
            cursor: not-allowed;
            transform: none;
        }

        #reset-link {
            margin-top: 80px;
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 0.75rem;
            font-weight: 400;
            cursor: pointer;
            text-decoration: underline;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 8px;
            height: auto;
            flex: none;
            width: auto;
        }
    </style>
</head>
<body>

    <h1 id="title">First to 0</h1>

    <div class="hb-container">
        <div id="health-bar" class="hb-fill"></div>
        <div id="health-text" class="hb-text">Loading...</div>
    </div>

    <div class="btn-group">
        <button id="light-btn" class="btn-light">-100</button>
        <button id="ability-btn" class="btn-medium">-200</button>
        <button id="heavy-btn" class="btn-heavy">-1400</button>
    </div>

    <button id="reset-link">Restart</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const title = document.getElementById('title');
        const healthBar = document.getElementById('health-bar');
        const healthText = document.getElementById('health-text');
        const lightBtn = document.getElementById('light-btn');
        const abilityBtn = document.getElementById('ability-btn');
        const heavyBtn = document.getElementById('heavy-btn');
        const resetLink = document.getElementById('reset-link');

        let currentLocalHealth = null;
        let currentMaxHealth = null;
        let localHeavySpent = false;
        let abilityCooldownActive = false;
        let gameOverState = false;

        function renderHealth(health, max) {
            if (max === 0 || max === null) return;
            const percentage = Math.max(0, (health / max) * 100);
            healthBar.style.width = `${percentage}%`;
            healthText.innerText = `${Math.max(0, health)} / ${max}`;
        }

        function handleAttack(type) {
            if (currentLocalHealth <= 0 || gameOverState || currentLocalHealth === null) return;

            if (type === 'light') {
                currentLocalHealth = Math.max(0, currentLocalHealth - 100);
                socket.emit('attack', 'light');
            } 
            else if (type === 'ability') {
                if (abilityCooldownActive) return;
                
                abilityCooldownActive = true;
                abilityBtn.disabled = true;
                abilityBtn.innerText = "CD";

                setTimeout(() => {
                    abilityCooldownActive = false;
                    if (!gameOverState) {
                        abilityBtn.disabled = false;
                        abilityBtn.innerText = "-200";
                    }
                }, 1000);

                currentLocalHealth = Math.max(0, currentLocalHealth - 200);
                socket.emit('attack', 'ability');
            }
            else if (type === 'heavy') {
                if (localHeavySpent) return;
                localHeavySpent = true;
                heavyBtn.disabled = true;
                currentLocalHealth = Math.max(0, currentLocalHealth - 1400);
                socket.emit('attack', 'heavy');
            }

            renderHealth(currentLocalHealth, currentMaxHealth);

            if (currentLocalHealth === 0) {
                setButtonsDisabled(true);
            }
        }

        function setButtonsDisabled(disabled) {
            lightBtn.disabled = disabled;
            heavyBtn.disabled = disabled;
            if (disabled || abilityCooldownActive) {
                abilityBtn.disabled = true;
            } else {
                abilityBtn.disabled = false;
            }
        }

        lightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleAttack('light'); });
        abilityBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleAttack('ability'); });
        heavyBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleAttack('heavy'); });
        resetLink.addEventListener('click', () => socket.emit('requestReset'));

        socket.on('stateUpdate', (data) => {
            currentMaxHealth = data.maxHealth || 2000;
            currentLocalHealth = data.health;
            gameOverState = data.gameOver;
            
            renderHealth(currentLocalHealth, currentMaxHealth);

            if (gameOverState) {
                setButtonsDisabled(true);
                abilityBtn.innerText = "-200";
                healthBar.style.background = "#a1a1aa";
                
                if (data.winnerId === socket.id) {
                    title.innerText = "OBJECTIVE SECURED";
                    title.style.color = "#18181b";
                    document.body.style.backgroundColor = "#f0fdf4";
                } else {
                    title.innerText = "OBJECTIVE STOLEN";
                    title.style.color = "#dc2626";
                    document.body.style.backgroundColor = "#fef2f2";
                }
            } else {
                title.innerText = "First to 0";
                title.style.color = "#18181b";
                healthBar.style.background = "#18181b";
                document.body.style.backgroundColor = "#fafafa";
                
                lightBtn.disabled = false;
                if (!localHeavySpent) heavyBtn.disabled = false;
                if (!abilityCooldownActive) {
                    abilityBtn.disabled = false;
                    abilityBtn.innerText = "-200";
                }
            }
        });

        socket.on('heavyAttackSpent', () => {
            localHeavySpent = true;
            heavyBtn.disabled = true;
        });

        socket.on('resetClientButtons', () => {
            localHeavySpent = false;
            heavyBtn.disabled = false;
            abilityCooldownActive = false;
            abilityBtn.innerText = "-200";
        });
    </script>
</body>
</html>
